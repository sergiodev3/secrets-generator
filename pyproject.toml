[project]
name = "secrets-generator"
version = "0.1.0"
description = "CLI to generate cryptographically secure secrets for production apps"
readme = "README.md"
authors = [{ name = "sergiodev3" }]
requires-python = ">=3.12"
dependencies = [
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.12",
]

[project.scripts]
secrets-gen = "secrets_generator.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secrets_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
